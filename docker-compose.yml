services:
  web:
    build: .
    ports:
      - "3000:80"
    restart: unless-stopped

  # Opcional: ambiente de desenvolvimento com hot-reload
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules  # evita sobrescrever node_modules do host
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - dev
